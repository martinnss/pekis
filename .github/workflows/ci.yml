name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test (unit tests only)
        env:
          PEKIS_SKIP_CLOUDKIT: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pekis.xcodeproj \
            -scheme Pekis \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -only-testing:PekisTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color
